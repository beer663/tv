android.useAndroidX=true
# "+" = newest GeckoView. Once the app builds and works, pin a real version from
# https://maven.mozilla.org/maven2/org/mozilla/geckoview/ (e.g. geckoVersion=128.0.20240704091224 -- unverified, check it exists).
# If Gradle can't find the artifact, try geckoview-omni or geckoview-release for geckoArtifact.
geckoArtifact=geckoview
geckoVersion=+
